<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COURSIFY | Login</title>
    <meta
        name="description"
        content="Login to your COURSIFY account to view your profile."
    >

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================
         Header
    ========================== -->
    <header class="site-header">

        <div class="header-content">

            <!-- Hamburger Menu -->
            <button
                type="button"
                class="menu-button"
                id="menuButton"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>


            <!-- Brand -->
            <a href="login.html" class="brand">
                COURSIFY
            </a>


            <!-- Know More -->
            <button
                type="button"
                class="know-more-button"
                id="knowMoreButton"
            >
                Know more
            </button>

        </div>


        <!-- Mobile Navigation -->
        <nav
            class="mobile-menu"
            id="mobileMenu"
            aria-hidden="true"
        >
            <a href="../home-page/index.html">Home</a>
            <a href="../sign-up/sign-up.html" target="_blank">Sign Up</a>
            <a href="#about">About</a>
        </nav>

    </header>


    <!-- =========================
         Main Content
    ========================== -->
    <main class="main-content">

        <section class="login-section">

            <!-- Page Heading -->
            <h1>
                Login to your account
                <span>to view your profile</span>
            </h1>


            <!-- Supporting Text -->
            <p class="intro-text">
                Sign in to continue your COURSIFY learning experience.
            </p>


            <!-- =========================
                 Login Card
            ========================== -->
            <div class="login-card">

                <h2>Login to your account</h2>


                <form
                    id="loginForm"
                    novalidate
                >

                    <!-- Username -->
                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Username or Email"
                            autocomplete="username"
                            required
                        >

                        <small
                            class="field-error"
                            id="usernameError"
                        ></small>

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                        <small
                            class="field-error"
                            id="passwordError"
                        ></small>

                    </div>


                    <!-- API Error -->
                    <div
                        class="login-alert"
                        id="loginAlert"
                        role="alert"
                        aria-live="polite"
                    ></div>

                    <!-- Forgot Password -->
                    <a href="../forgot-password-page/forgot-password.html" class="forgot-password">
                        Forgot password?
                    </a>
                    <!-- Sign In -->
                    <button
                        type="submit"
                        class="signin-button"
                        id="signinButton"
                    >

                        <span id="buttonText">
                            Sign in
                        </span>

                        <span
                            class="loading-spinner"
                            id="loadingSpinner"
                            aria-hidden="true"
                        ></span>

                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- =========================
         About Section
    ========================== -->
    <section
        class="about-section"
        id="about"
    >

        <div class="about-content">

            <span class="section-label">
                COURSIFY
            </span>

            <h2>
                Learn. Grow. Succeed.
            </h2>

            <p>
                Access your courses, manage your profile,
                and continue your learning journey.
            </p>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
