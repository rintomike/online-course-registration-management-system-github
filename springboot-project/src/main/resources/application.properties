# Import env.properties
spring.config.import=optional:classpath:env.properties
# Map the properties (with optional fallback defauts)
admin.name=${ADMIN_NAME}
admin.password=${ADMIN_PASSWORD}

# Same database the original CLI app connected to
spring.datasource.url=jdbc:mysql://localhost:3306/stdcourse
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Maps to your EXISTING tables (allinfo, allcourse, student_courses) - does not recreate them
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Frontend origin allowed to call this API - change to match where your HTML/JS is served from
app.cors.allowed-origin=http://127.0.0.1:5500
